# Runs every check on a clean Windows machine for each pull request and each push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still checking the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit (tags can be moved); the comment says which release it is.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # go.mod is the single source of truth for the Go version, like .nvmrc for Node.
      # No module cache yet: the core has no dependencies, so there is no go.sum to key it on.
      # When it gets some, replace `cache: false` with `cache-dependency-path: core/go.sum`.
      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Check the Go core (format, vet, tests)
        shell: bash
        working-directory: core
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      # Builds core.exe too, so a Go compile error fails CI.
      - name: Build
        run: npm run build:core && npx electron-vite build

      # Launches the app built in the previous step (no second build).
      - name: End-to-end tests
        run: npx playwright test

      # Traces and failure details, downloadable from the run's summary page.
      - name: Upload end-to-end results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
